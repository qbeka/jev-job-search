<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="t d">
  <title id="t">Jev the beaver</title>
  <desc id="d">A small brown beaver holding a filled-in application form with a green check mark on it.</desc>
  <!-- tail -->
  <g transform="rotate(-28 392 372)">
    <ellipse cx="392" cy="372" rx="92" ry="50" fill="#5a3825"/>
    <g stroke="#46291a" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M330 350l40 44M362 334l52 58M398 328l52 56M434 336l34 38"/>
      <path d="M318 388l44-52M350 410l62-76M392 416l58-70M436 408l34-42"/>
    </g>
  </g>
  <!-- feet -->
  <ellipse cx="196" cy="452" rx="44" ry="20" fill="#46291a"/>
  <ellipse cx="316" cy="452" rx="44" ry="20" fill="#46291a"/>
  <!-- body -->
  <path d="M256 250c80 0 122 54 122 118 0 56-46 88-122 88s-122-32-122-88c0-64 42-118 122-118z" fill="#8a5a3b"/>
  <ellipse cx="256" cy="384" rx="76" ry="62" fill="#e3bd92"/>
  <!-- ears -->
  <circle cx="150" cy="98" r="34" fill="#8a5a3b"/>
  <circle cx="150" cy="98" r="17" fill="#5a3825"/>
  <circle cx="362" cy="98" r="34" fill="#8a5a3b"/>
  <circle cx="362" cy="98" r="17" fill="#5a3825"/>
  <!-- head -->
  <path d="M256 56c96 0 152 58 152 132 0 72-58 118-152 118s-152-46-152-118c0-74 56-132 152-132z" fill="#9c6845"/>
  <!-- muzzle -->
  <ellipse cx="256" cy="232" rx="78" ry="56" fill="#f0d3ae"/>
  <!-- cheeks -->
  <ellipse cx="156" cy="222" rx="22" ry="14" fill="#e58f77" opacity=".55"/>
  <ellipse cx="356" cy="222" rx="22" ry="14" fill="#e58f77" opacity=".55"/>
  <!-- eyes -->
  <circle cx="196" cy="168" r="23" fill="#2a1a12"/>
  <circle cx="316" cy="168" r="23" fill="#2a1a12"/>
  <circle cx="204" cy="159" r="8" fill="#fff"/>
  <circle cx="324" cy="159" r="8" fill="#fff"/>
  <circle cx="189" cy="176" r="4" fill="#fff" opacity=".8"/>
  <circle cx="309" cy="176" r="4" fill="#fff" opacity=".8"/>
  <!-- nose and mouth -->
  <path d="M232 204c0-9 11-14 24-14s24 5 24 14c0 10-12 20-24 20s-24-10-24-20z" fill="#3a2217"/>
  <ellipse cx="248" cy="199" rx="7" ry="3.5" fill="#fff" opacity=".35"/>
  <path d="M256 224v14M222 244c10 12 24 12 34-4 10 16 24 16 34 4" stroke="#3a2217" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- teeth -->
  <path d="M240 246h32v26c0 5-3 8-8 8h-16c-5 0-8-3-8-8z" fill="#fff" stroke="#3a2217" stroke-width="5" stroke-linejoin="round"/>
  <path d="M256 248v30" stroke="#3a2217" stroke-width="4" stroke-linecap="round"/>
  <!-- the form -->
  <g transform="rotate(-6 256 388)">
    <rect x="186" y="318" width="140" height="150" rx="12" fill="#fff" stroke="#2a1a12" stroke-width="6"/>
    <g stroke="#b9c2cf" stroke-width="8" stroke-linecap="round">
      <path d="M208 350h64M208 376h96M208 402h80M208 428h52"/>
    </g>
    <circle cx="298" cy="436" r="26" fill="#22a45d" stroke="#2a1a12" stroke-width="6"/>
    <path d="M286 437l9 9 16-18" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <!-- paws -->
  <ellipse cx="180" cy="386" rx="24" ry="20" fill="#9c6845" stroke="#5a3825" stroke-width="5"/>
  <ellipse cx="334" cy="372" rx="24" ry="20" fill="#9c6845" stroke="#5a3825" stroke-width="5"/>
</svg>
